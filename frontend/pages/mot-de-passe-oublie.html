<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - Vite & Gourmand</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="/assets/images/favicon.jpg">
</head>
<body>

    <div id="header"></div>

    <main>
        <section class="inscription-section">
            <div class="container">

                <div id="zone-messages"></div>

                <div class="inscription-box">

                    <h1>Mot de passe oublié</h1>
                    <p class="inscription-subtitle">Entrez votre adresse email pour réinitialiser votre mot de passe</p>

                    <form id="form-reset" class="inscription-form">

                        <div class="form-group">
                            <label for="email">Adresse email *</label>
                            <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
                        </div>

                        <button type="submit" class="btn-inscription">Envoyer le lien de réinitialisation</button>

                    </form>

                    <div class="connexion-link">
                        <p>Vous vous souvenez de votre mot de passe ?
                            <a href="connexion.html">Se connecter</a>
                        </p>
                    </div>

                </div>

            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/components/header.js"></script>
    <script src="../assets/js/components/footer.js"></script>
    <script src="../assets/js/mot-de-passe-oublie.js"></script>
</body>
</html>
