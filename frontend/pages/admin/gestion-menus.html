<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des menus - Vite & Gourmand</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <div id="header"></div>

    <main>
        <section class="contact-section">
            <div class="container">

                <div id="zone-messages"></div>

                <div class="contact-header">
                    <h1>Gestion des menus</h1>
                    <p>Créer, modifier et supprimer les menus</p>
                </div>

                <div class="btn-creer-menu-container">
                    <a href="ajouter-menu.html" class="btn-hero">➕ Créer un nouveau menu</a>
                </div>

                <div id="liste-menus" class="liste-menus-admin"></div>

            </div>
        </section>

        <!-- Popup confirmation suppression -->
        <div class="popup-overlay" id="popupSuppression">
            <div class="popup-box">
                <h3>⚠️ Confirmation de suppression</h3>
                <p>Êtes-vous sûr de vouloir supprimer ce menu ?<br>Cette action est irréversible.</p>
                <div class="popup-actions">
                    <button class="popup-btn popup-btn-annuler" onclick="fermerPopup()">Annuler</button>
                    <a href="#" id="lienSuppression" class="popup-btn popup-btn-confirmer">Supprimer</a>
                </div>
            </div>
        </div>

    </main>

    <div id="footer"></div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/components/header.js"></script>
    <script src="../../assets/js/components/footer.js"></script>
    <script src="../../assets/js/admin/gestion-menus.js"></script>
</body>
</html>
