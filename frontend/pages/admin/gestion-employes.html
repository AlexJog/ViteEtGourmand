<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des employés - Vite & Gourmand</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/png" href="/assets/images/favicon.jpg">
</head>
<body>

    <div id="header"></div>

    <main>
        <section class="contact-section">
            <div class="container">

                <div id="zone-messages"></div>

                <div class="contact-header">
                    <h1>Gestion des employés</h1>
                    <p>Gérez les comptes employés de votre entreprise</p>
                </div>

                <div id="liste-employes"></div>

            </div>
        </section>
    </main>

    <!-- Popup confirmation changement de statut -->
    <div class="popup-overlay" id="popupStatut">
        <div class="popup-box">
            <h3 id="popup-titre"></h3>
            <p id="popup-message"></p>
            <div class="popup-actions">
                <button class="popup-btn popup-btn-annuler" onclick="fermerPopup()">Annuler</button>
                <button class="popup-btn popup-btn-confirmer" id="popup-btn-confirmer" onclick="confirmerChangement()">Confirmer</button>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/components/header.js"></script>
    <script src="../../assets/js/components/footer.js"></script>
    <script src="../../assets/js/admin/gestion-employes.js"></script>
</body>
</html>
