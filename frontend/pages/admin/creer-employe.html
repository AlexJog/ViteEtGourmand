<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un employé - Vite & Gourmand</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/png" href="/assets/images/favicon.jpg">
</head>
<body>

    <div id="header"></div>

    <main>
        <section class="contact-section">
            <div class="container">

                <div id="zone-messages"></div>

                <div class="contact-header">
                    <h1>Créer un compte employé</h1>
                    <p>Ajoutez un nouveau membre à votre équipe</p>
                </div>

                <div class="contact-form-container">
                    <form id="form-creer-employe" class="contact-form">

                        <div class="form-row">
                            <div class="form-group">
                                <label for="nom">Nom *</label>
                                <input type="text" id="nom" name="nom" required>
                            </div>
                            <div class="form-group">
                                <label for="prenom">Prénom *</label>
                                <input type="text" id="prenom" name="prenom" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" required>
                            <small class="form-hint">Cet email servira d'identifiant de connexion</small>
                        </div>

                        <div class="form-group">
                            <label for="telephone">Téléphone *</label>
                            <input type="tel" id="telephone" name="telephone" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Mot de passe *</label>
                            <input type="password" id="password" name="password" required>
                            <small class="form-hint">10 caractères minimum : 1 majuscule, 1 minuscule, 1 chiffre, 1 caractère spécial (@#$%&*!?.,;:_-)</small>
                        </div>

                        <div class="form-buttons">
                            <button type="submit" class="btn-contact">✅ Créer le compte employé</button>
                            <a href="dashboard.html" class="btn-secondary">❌ Annuler</a>
                        </div>

                    </form>
                </div>

            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/components/header.js"></script>
    <script src="../../assets/js/components/footer.js"></script>
    <script src="../../assets/js/admin/creer-employe.js"></script>
</body>
</html>
